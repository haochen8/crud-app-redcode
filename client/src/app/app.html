<a class="visually-hidden-focusable skip-link" href="#main-content" (click)="skipToMain($event)">
  Skip to main content
</a>

<header>
  <nav class="navbar navbar-expand-md bg-primary navbar-dark shadow-sm" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/books" (click)="closeMenu()">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        <span>{{ title() }}</span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        aria-controls="main-navigation"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <div id="main-navigation" class="collapse navbar-collapse" [class.show]="isMenuOpen()">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/books"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              <i class="fa-solid fa-book me-1" aria-hidden="true"></i>
              Books
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/quotes"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              <i class="fa-solid fa-quote-left me-1" aria-hidden="true"></i>
              My Quotes
            </a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item me-md-2">
            <button
              class="btn btn-link nav-link"
              type="button"
              [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
              [attr.title]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
              (click)="toggleTheme()"
            >
              <i
                class="fa-solid"
                [class.fa-sun]="theme() === 'dark'"
                [class.fa-moon]="theme() === 'light'"
                aria-hidden="true"
              ></i>
              <span class="d-md-none ms-1">{{ theme() === 'dark' ? 'Light Theme' : 'Dark Theme' }}</span>
            </button>
          </li>
          @if (isAuthenticated()) {
            <li class="nav-item">
              <button class="btn btn-link nav-link" type="button" (click)="logout()">
                <i class="fa-solid fa-right-from-bracket me-1" aria-hidden="true"></i>
                Logout
              </button>
            </li>
          } @else {
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/login"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
              >
                <i class="fa-solid fa-right-to-bracket me-1" aria-hidden="true"></i>
                Login
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                routerLink="/register"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
              >
                <i class="fa-solid fa-user-plus me-1" aria-hidden="true"></i>
                Register
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>

<main id="main-content" class="container py-4 py-md-5" tabindex="-1">
  <router-outlet />
</main>
