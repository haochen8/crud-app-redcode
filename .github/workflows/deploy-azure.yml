name: Deploy to Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Build and deploy the full application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check deployment configuration
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || (echo "Missing repository variable AZURE_WEBAPP_NAME" && exit 1)
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || (echo "Missing repository secret AZURE_WEBAPP_PUBLISH_PROFILE" && exit 1)

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build Angular for the production origin
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Add Angular assets to the API
        run: |
          mkdir -p server/BookQuotes.Api/wwwroot
          cp -R client/dist/book-quotes-client/browser/. server/BookQuotes.Api/wwwroot/

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish the combined application
        run: |
          dotnet restore server/BookQuotes.sln
          dotnet publish server/BookQuotes.Api/BookQuotes.Api.csproj \
            --configuration Release \
            --no-restore \
            --output publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
